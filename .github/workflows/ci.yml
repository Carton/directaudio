name: Build DirectAudio unixlib

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  PROTON_REPO: The412Banner/proton-wine

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h | head -2

      - name: Checkout Wine 11 classic tree (proton-wine)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTON_REPO }}
          ref: ge-proton11-bionic
          path: wine
          submodules: recursive

      - name: Checkout this driver (source under test)
        uses: actions/checkout@v4
        with:
          path: driver

      - name: Overlay driver source
        run: |
          cp driver/directaudio.c driver/Makefile.in driver/da_relay_proto.h driver/da_aaudio_compat.h wine/dlls/winedirectaudio.drv/
          grep -q 'ndk/27.3.13750724/toolchains' wine/build-scripts/build-step-arm64ec.sh
          sed -i 's|ndk/27.3.13750724/toolchains|ndk/29.0.14206865/toolchains|g; s/--with-xshm/--without-xshm/; s/--with-xrandr/--without-xrandr/; s/--with-xrender/--without-xrender/' wine/build-scripts/build-step-arm64ec.sh

      - name: Set up build environment
        # libwayland-bin: wayland-scanner, which the trees that build winewayland.drv
        # (proton_10.0, the CachyOS branches) look for at configure time.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip flex bison gettext \
            autoconf automake libtool pkg-config mingw-w64 \
            gcc-multilib g++-multilib ccache libwayland-bin \
            libfreetype6-dev libfreetype6-dev:i386 \
            libpng-dev libpng-dev:i386 zlib1g-dev zlib1g-dev:i386

      - name: Download termuxfs (aarch64)
        run: |
          mkdir -p $HOME/termuxfs/aarch64 && cd $HOME/termuxfs/aarch64
          wget -q https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-aarch64.tar
          tar -xf termuxfs-aarch64.tar

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/29.0.14206865
          key: android-ndk-r29
      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk && cd $HOME/Android/Sdk/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          mv android-ndk-r29 29.0.14206865

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920
      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains && cd $HOME/toolchains
          wget -q https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Autogen
        working-directory: wine
        run: |
          bash build-scripts/build-step0-autogen.sh

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine/wine-tools
          key: wine-tools-ge-proton11-bionic-${{ hashFiles('wine/configure.ac') }}
      - name: Build wine-tools
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        working-directory: wine
        run: bash build-scripts/build-step0.sh

      - name: Cache ccache (wine11-arm64ec-sdk28)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-da-wine11-arm64ec-sdk28-${{ github.sha }}
          restore-keys: |
            ccache-da-wine11-arm64ec-sdk28-

      - name: Build sysvshm (satisfies configure's --with-xshm requirement)
        working-directory: wine
        run: bash build-scripts/build-step-arm64ec.sh --build-sysvshm

      - name: Configure + build ONLY the DirectAudio driver
        working-directory: wine
        shell: bash
        run: |
          set -eo pipefail
          # `source` so the arm64ec toolchain env the script exports (CC/CFLAGS/
          # CROSSCFLAGS/PATH/DLLTOOL/…) persists into this shell for the targeted
          # make below. The script also applies the bionic + GE patches + configures.
          source build-scripts/build-step-arm64ec.sh --configure
          test "$TARGET" = aarch64-linux-android28
          make -j"$(nproc)" dlls/winedirectaudio.drv/winedirectaudio.so

      - name: Prepare DirectAudio unixlib
        shell: bash
        run: |
          set -euo pipefail
          so=wine/dlls/winedirectaudio.drv/winedirectaudio.so
          readelf="$HOME/Android/Sdk/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -f "$so"
          "$readelf" -d "$so" | grep -F 'Shared library: [libaaudio.so]'
          python3 - "$so" <<'PYCODE'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = path.read_bytes()
          old, new = b'libaaudio.so\0', b'libwaudio.so\0'
          if data.count(old) != 1:
              raise SystemExit('expected exactly one libaaudio.so string')
          path.write_bytes(data.replace(old, new))
          PYCODE
          "$readelf" -d "$so" | grep -F 'Shared library: [libwaudio.so]'
          if "$readelf" -d "$so" | grep -F 'Shared library: [libaaudio.so]'; then exit 1; fi
          "$readelf" --dyn-syms "$so" | grep -F '__wine_unix_call'
          "$readelf" -lW "$so" | awk '$1 == "LOAD" { found = 1; if ($NF != "0x4000") exit 1 } END { if (!found) exit 1 }'
          "$readelf" -n "$so" | grep -F '1c 00 00 00 72 32 39'
          mkdir -p out
          cp "$so" out/winedirectaudio.so
          sha256sum out/winedirectaudio.so > out/SHA256SUMS

      - name: Upload Wine 11 classic ARM64 unixlib
        uses: actions/upload-artifact@v4
        with:
          name: directaudio-wine11-arm64-api28-16k
          path: out/
          if-no-files-found: error
          retention-days: 30
